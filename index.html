<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lottery Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .participant img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }
    .winner { border: 2px solid #198754; background-color: #d1e7dd !important; }
    .expired { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h2 class="text-center mb-4">🎟️ Lottery Management System</h2>

    <!-- Create Room -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Create New Lottery Room</h5>
        <div class="input-group mb-3">
          <input id="roomName" type="text" class="form-control" placeholder="Enter room name (e.g., Diwali Bonanza)">
          <button class="btn btn-primary" onclick="createRoom()">Create</button>
        </div>
      </div>
    </div>

    <!-- Rooms -->
    <div id="roomsContainer" class="row g-4"></div>

    <!-- Winner History -->
    <div class="card mt-5 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">🏆 Winner History</h5>
        <ul id="winnerList" class="list-group"></ul>
      </div>
    </div>
  </div>

  <!-- Add Participant Modal -->
  <div class="modal fade" id="participantModal" tabindex="-1" aria-labelledby="participantModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="participantForm" class="modal-content" onsubmit="submitParticipant(event)">
        <div class="modal-header">
          <h5 class="modal-title" id="participantModalLabel">Add Participant</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="activeRoomName">

          <div class="mb-3">
            <label for="pname" class="form-label">Name</label>
            <input type="text" id="pname" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="pphone" class="form-label">Contact Number</label>
            <input type="text" id="pphone" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="pimage" class="form-label">Upload Image (max 80KB)</label>
            <input type="file" id="pimage" class="form-control" accept="image/*" required>
            <small class="text-muted">Image preview below</small>
            <div class="mt-2 text-center">
              <img id="previewImg" src="" alt="" class="rounded-circle" style="display:none;width:70px;height:70px;object-fit:cover;">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Add Participant</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
